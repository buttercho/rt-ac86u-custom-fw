name: Build & Verify RT-AC86U Custom Firmware (386.14_2-sec2026)

on:
  workflow_dispatch:
    inputs:
      build_label:
        description: "Optional artifact version suffix (defaults to sec2026-set2 on set2-static-opt, sec2026 otherwise)"
        required: false
        default: ""
        type: string
      apply_set2_optimizations:
        description: "Apply Set 2 static-analysis CPU/RAM/SMP/RPS optimizations (patches 006..009 + wsdd2 A-11)"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - set2-static-opt

permissions:
  contents: read

concurrency:
  group: rt-ac86u-fw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify-rt-ac86u:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    env:
      MERLIN_BASE_COMMIT: "6a5df61aab6f3fa2dffc518994d42e4f2a27fb2b"
      TOOLCHAIN_COMMIT: "d1af80e6b6686a4edc680386c09a8361453dd5c1"

    steps:
      - name: Reclaim runner SSD space & install verification tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils cppcheck curl git python3 python3-yaml qemu-user-static unzip
          mkdir -p /tmp/am-toolchains /tmp/ccache
          df -h

      - name: Checkout custom patch & verification repository
        uses: actions/checkout@v4
        with:
          path: custom-fw

      - name: Checkout RMerl/asuswrt-merlin.ng pinned at 386.14_2
        uses: actions/checkout@v4
        with:
          repository: RMerl/asuswrt-merlin.ng
          ref: ${{ env.MERLIN_BASE_COMMIT }}
          path: asuswrt-merlin.ng
          fetch-depth: 1

      - name: Apply 2024-2026 dependency backports & modular RT-AC86U patches
        env:
          INPUT_APPLY_SET2: ${{ inputs.apply_set2_optimizations }}
        run: |
          chmod +x "${GITHUB_WORKSPACE}/custom-fw/scripts/"*.sh "${GITHUB_WORKSPACE}/custom-fw/tests/"*.sh
          EXTRA_FLAGS=()
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_APPLY_SET2}" == "false" ]]; then
            EXTRA_FLAGS+=(--set1-only)
          fi
          "${GITHUB_WORKSPACE}/custom-fw/scripts/apply_backports.sh" "${EXTRA_FLAGS[@]}" "${GITHUB_WORKSPACE}/asuswrt-merlin.ng"

      - name: Cache pinned Broadcom HND GCC 5.3 toolchains
        id: cache-toolchains
        uses: actions/cache/restore@v4
        with:
          path: /tmp/am-toolchains
          key: am-toolchains-hnd-v2-${{ env.TOOLCHAIN_COMMIT }}

      - name: Restore ccache for HND kernel & router objects
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: rt-ac86u-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            rt-ac86u-ccache-${{ github.ref_name }}-
            rt-ac86u-ccache-

      - name: Build Asuswrt-Merlin fw-build:20.04 container & prepare HND GCC 5.3 toolchains + ccache
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/Asuswrt-Merlin/am-buildtools.git "${GITHUB_WORKSPACE}/am-buildtools"
          docker build --build-arg UBUNTU_VERSION=20.04 -t fw-build:20.04 "${GITHUB_WORKSPACE}/am-buildtools/docker"
          docker build -t fw-build:20.04 - <<'DOCKEREOF'
          FROM fw-build:20.04
          RUN apt-get update && apt-get install -y --no-install-recommends ccache && rm -rf /var/lib/apt/lists/*
          DOCKEREOF

          if [[ "${{ steps.cache-toolchains.outputs.cache-hit }}" != "true" || ! -e /tmp/am-toolchains/brcm-arm-hnd/crosstools-arm-gcc-5.3-linux-4.1-glibc-2.22-binutils-2.25/usr/bin/arm-buildroot-linux-gnueabi-gcc ]]; then
            rm -rf /tmp/am-toolchains
            mkdir -p /tmp/am-toolchains
            cd /tmp/am-toolchains
            git init
            git remote add origin https://github.com/Asuswrt-Merlin/am-toolchains.git
            git config core.sparseCheckout true
            cat <<'EOF' > .git/info/sparse-checkout
          brcm-arm-hnd/crosstools-arm-gcc-5.3-linux-4.1-glibc-2.22-binutils-2.25/
          brcm-arm-hnd/crosstools-aarch64-gcc-5.3-linux-4.1-glibc-2.22-binutils-2.25/
          EOF
            git fetch --depth 1 origin "${TOOLCHAIN_COMMIT}"
            git checkout FETCH_HEAD
          fi

          # Idempotently wrap Buildroot real compiler ELF binaries so absolute /opt/toolchains/... invocations use ccache
          for real_bin in /tmp/am-toolchains/brcm-arm-hnd/crosstools-*/usr/bin/*.br_real; do
            case "${real_bin}" in
              *-gcc.br_real|*-gcc-[0-9]*.br_real|*-g++.br_real|*-c++.br_real) ;;
              *) continue ;;
            esac
            [[ -f "${real_bin}" && ! -L "${real_bin}" ]] || continue
            if [[ ! -e "${real_bin}.orig" ]]; then
              mv "${real_bin}" "${real_bin}.orig"
              cat <<'WRAPEOF' > "${real_bin}"
          #!/bin/sh
          REAL="$(readlink -f "$0")"
          if [ -n "${CCACHE_DIR:-}" ] && [ -x /usr/bin/ccache ]; then
            exec /usr/bin/ccache "${REAL}.orig" "$@"
          fi
          exec "${REAL}.orig" "$@"
          WRAPEOF
              chmod 0755 "${real_bin}"
            fi
          done

          mkdir -p /tmp/ccache
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v /tmp/ccache:/workspace/ccache \
            -e CCACHE_DIR=/workspace/ccache \
            -e CCACHE_COMPILERCHECK=content \
            -v "/tmp/am-toolchains/brcm-arm-hnd:/opt/toolchains:ro" \
            fw-build:20.04 \
            bash -ec '
              arm-buildroot-linux-gnueabi-gcc --version
              aarch64-buildroot-linux-gnu-gcc --version
              ccache -z
              printf "int f(int x){return x+1;}\n" > /tmp/ccache_smoke.c
              arm-buildroot-linux-gnueabi-gcc -c /tmp/ccache_smoke.c -o /tmp/t32.o
              arm-buildroot-linux-gnueabi-gcc -c /tmp/ccache_smoke.c -o /tmp/t32.o
              aarch64-buildroot-linux-gnu-gcc -c /tmp/ccache_smoke.c -o /tmp/t64.o
              aarch64-buildroot-linux-gnu-gcc -c /tmp/ccache_smoke.c -o /tmp/t64.o
              ccache -s
              rm -f /tmp/ccache_smoke.c /tmp/t32.o /tmp/t64.o
            '

      - name: "STAGE 1 (Pre-Build): Patch, Struct ABI & Closed-Source .o Blob Contract Gate"
        env:
          INPUT_APPLY_SET2: ${{ inputs.apply_set2_optimizations }}
        run: |
          STAGE1_FLAGS=()
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_APPLY_SET2}" == "false" ]]; then
            STAGE1_FLAGS+=(--set1-only)
          fi
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/custom-fw:/workspace/custom-fw:ro" \
            -v "${GITHUB_WORKSPACE}/asuswrt-merlin.ng:/workspace/build/asuswrt-merlin.ng:ro" \
            -v "/tmp/am-toolchains/brcm-arm-hnd:/opt/toolchains:ro" \
            fw-build:20.04 \
            /workspace/custom-fw/tests/stage1_prebuild_gate.sh --already-patched "${STAGE1_FLAGS[@]}" /workspace/build/asuswrt-merlin.ng

      - name: "STAGE 2 (Pre-Build): ASan + UBSan + GCC -fanalyzer + cppcheck Gate"
        run: |
          "${GITHUB_WORKSPACE}/custom-fw/tests/run_stage2_local_and_ci.sh" "${GITHUB_WORKSPACE}/asuswrt-merlin.ng"

      - name: Compile RT-AC86U firmware inside fw-build:20.04 (make rt-ac86u)
        run: |
          set -o pipefail
          mkdir -p /tmp/fw-home /tmp/ccache
          if ! docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -v /tmp/fw-home:/home/runner \
            -e HOME=/home/runner \
            -e USER="$(id -un)" \
            -e LC_ALL=C.UTF-8 \
            -e LANG=C.UTF-8 \
            -e FORCE_UNSAFE_CONFIGURE=1 \
            -v /tmp/ccache:/workspace/ccache \
            -e CCACHE_DIR=/workspace/ccache \
            -e CCACHE_MAXSIZE=2G \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_SLOPPINESS=time_macros \
            -v "${GITHUB_WORKSPACE}/asuswrt-merlin.ng:/workspace/build/asuswrt-merlin.ng" \
            -v "/tmp/am-toolchains/brcm-arm-hnd:/opt/toolchains:ro" \
            -w /workspace/build/asuswrt-merlin.ng/release/src-rt-5.02hnd \
            fw-build:20.04 \
            make rt-ac86u 2>&1 | tee /tmp/fw-build.log; then
            echo "::error::make rt-ac86u failed — primary error lines:"
            grep -E "(: error:|undefined reference|Error [0-9]+|ERROR:|FATAL:)" /tmp/fw-build.log | tail -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
            tail -n 60 /tmp/fw-build.log || true
            if [[ -f "${GITHUB_WORKSPACE}/asuswrt-merlin.ng/release/src-rt-5.02hnd/router/.config" ]]; then
              echo "::warning::Running make -k router harvest sweep over modified/backported packages to surface any secondary errors..."
              docker run --rm \
                -u "$(id -u):$(id -g)" \
                -v /etc/passwd:/etc/passwd:ro \
                -v /etc/group:/etc/group:ro \
                -v /tmp/fw-home:/home/runner \
                -e HOME=/home/runner \
                -e USER="$(id -un)" \
                -e LC_ALL=C.UTF-8 \
                -e LANG=C.UTF-8 \
                -e FORCE_UNSAFE_CONFIGURE=1 \
                -v /tmp/ccache:/workspace/ccache \
                -e CCACHE_DIR=/workspace/ccache \
                -e CCACHE_MAXSIZE=2G \
                -e CCACHE_COMPILERCHECK=content \
                -e CCACHE_SLOPPINESS=time_macros \
                -v "${GITHUB_WORKSPACE}/asuswrt-merlin.ng:/workspace/build/asuswrt-merlin.ng" \
                -v "/tmp/am-toolchains/brcm-arm-hnd:/opt/toolchains:ro" \
                -w /workspace/build/asuswrt-merlin.ng/release/src-rt-5.02hnd/router \
                fw-build:20.04 \
                make -k openssl-1.1 zlib sqlite expat-2.0.1 libcap-ng nettle dropbear curl wget openvpn miniupnpd dnsmasq haveged nano wsdd2 wireguard-tools shared libdisk libovpn rstats cstats httpd rc busybox libxml2 inadyn \
                2>&1 | tee /tmp/fw-harvest.log || true
              grep -E "(: error:|undefined reference|Error [0-9]+|FATAL:)" /tmp/fw-harvest.log | tail -n 30 | while IFS= read -r line; do
                echo "::error::[harvest] ${line}"
              done || true
            fi
            exit 1
          fi
          docker run --rm -u "$(id -u):$(id -g)" -v /tmp/ccache:/workspace/ccache -e CCACHE_DIR=/workspace/ccache fw-build:20.04 ccache -s || true

      - name: Immediately purge cferom bootloader image
        run: |
          set -o pipefail
          if ! (
            HND_ROOT="${GITHUB_WORKSPACE}/asuswrt-merlin.ng/release/src-rt-5.02hnd"
            TARGET_OUT="${HND_ROOT}/targets/94908HND"
            sudo chown -R "$(id -u):$(id -g)" "${TARGET_OUT}" || true
            rm -fv "${TARGET_OUT}"/*cferom* "${HND_ROOT}/image"/*cferom* 2>/dev/null || true
            ls -lh "${TARGET_OUT}"/*_ubi.w
          ) 2>&1 | tee /tmp/step-purge.log; then
            echo "::error::cferom purge or _ubi.w check failed — see log tail:"
            tail -n 30 /tmp/step-purge.log | while IFS= read -r line; do echo "::error::${line}"; done || true
            exit 1
          fi

      - name: "STAGE 3 (Post-Build): Full-RootFS ELF Linker, Symbol & Kernel .ko CRC Audit"
        run: |
          set -o pipefail
          HND_ROOT="${GITHUB_WORKSPACE}/asuswrt-merlin.ng/release/src-rt-5.02hnd"
          if ! python3 "${GITHUB_WORKSPACE}/custom-fw/tests/stage3_rootfs_elf_ko_audit.py" \
            --rootfs "${HND_ROOT}/targets/94908HND/fs.install" \
            --symvers "${HND_ROOT}/kernel/linux-4.1/Module.symvers" 2>&1 | tee /tmp/step-stage3.log; then
            grep -E "(FATAL|ERROR|Error|missing|mismatch)" /tmp/step-stage3.log | tail -n 20 | while IFS= read -r line; do
              echo "::error::[stage3] ${line}"
            done || echo "::error::STAGE 3 rootfs/ELF/.ko audit failed"
            exit 1
          fi

      - name: "STAGE 4 (Post-Build): QEMU Cortex-A53 Emulated Daemon Smoke Suite"
        run: |
          set -o pipefail
          HND_ROOT="${GITHUB_WORKSPACE}/asuswrt-merlin.ng/release/src-rt-5.02hnd"
          if ! "${GITHUB_WORKSPACE}/custom-fw/tests/stage4_qemu_smoke.sh" \
            "${HND_ROOT}/targets/94908HND/fs.install" \
            "${GITHUB_WORKSPACE}/asuswrt-merlin.ng" 2>&1 | tee /tmp/step-stage4.log; then
            grep -E "(FATAL|ERROR|Error|FAIL)" /tmp/step-stage4.log | tail -n 20 | while IFS= read -r line; do
              echo "::error::[stage4] ${line}"
            done || echo "::error::STAGE 4 QEMU smoke test failed"
            exit 1
          fi

      - name: "STAGE 5 (Post-Build): Final _ubi.w Image Forensics & Release Manifest"
        run: |
          set -o pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          TARGET_OUT="${GITHUB_WORKSPACE}/asuswrt-merlin.ng/release/src-rt-5.02hnd/targets/94908HND"
          FW_FILE="$(ls "${TARGET_OUT}"/RT-AC86U_*_ubi.w | head -n 1)"
          cp -v "${FW_FILE}" "${GITHUB_WORKSPACE}/dist/"
          cp -v "${GITHUB_WORKSPACE}/custom-fw/scripts/preflash_check_on_router.sh" "${GITHUB_WORKSPACE}/dist/"

          DIST_FW="${GITHUB_WORKSPACE}/dist/$(basename "${FW_FILE}")"
          if ! python3 "${GITHUB_WORKSPACE}/custom-fw/tests/stage5_image_forensics.py" \
            --image "${DIST_FW}" \
            --target-dir "${TARGET_OUT}" \
            --dist-dir "${GITHUB_WORKSPACE}/dist" 2>&1 | tee /tmp/step-stage5.log; then
            grep -E "(FATAL|ERROR|Error|FAIL)" /tmp/step-stage5.log | tail -n 20 | while IFS= read -r line; do
              echo "::error::[stage5] ${line}"
            done || echo "::error::STAGE 5 image forensics failed"
            exit 1
          fi

          cat "${GITHUB_WORKSPACE}/dist/TEST_REPORT.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload verified RT-AC86U _ubi.w firmware & pre-flash toolkit
        uses: actions/upload-artifact@v4
        with:
          name: RT-AC86U-386.14_2-${{ inputs.build_label || ((github.ref_name == 'set2-static-opt' && !(github.event_name == 'workflow_dispatch' && inputs.apply_set2_optimizations == false)) && 'sec2026-set2' || 'sec2026') }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Save Broadcom HND GCC 5.3 toolchains cache
        if: always() && steps.cache-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/am-toolchains
          key: ${{ steps.cache-toolchains.outputs.cache-primary-key }}

      - name: Save ccache for HND kernel & router objects
        if: always() && steps.cache-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}
